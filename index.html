<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0a1f">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>電脳写真機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the photo/video is the stage (left, sticky); a quiet control rack sits beside it and stacks under it on phones. */
:root{
  color-scheme:dark;
  --void:#0d0a1f; --panel:#161136; --raise:#211a4d; --line:#3b3080;
  --ink:#ece7ff; --dim:#a79cd9;
  --hot:#ff2e88; --ice:#2ef2ff; --volt:#ffe14a;
  --display:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--void)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,38px);margin:0;letter-spacing:.08em;line-height:1.1;
  text-shadow:2px 0 var(--hot),-2px 0 var(--ice)}
header p{margin:0;color:var(--dim);font-size:13px;flex:1 1 260px;min-width:0}
#lang{font-size:13px;padding:5px 10px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px;min-width:0}
.frame{position:relative;background:#06041180;border:1px solid var(--line);display:flex;justify-content:center;align-items:center;min-height:180px}
.frame.drag{border-color:var(--volt)}
#view{display:block;max-width:100%;max-height:74vh;width:auto;height:auto}
.tag{position:absolute;left:50%;transform:translateX(-50%);top:-1px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;background:var(--volt);color:#17123a;padding:1px 7px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-family:var(--mono);font-size:12px;color:var(--dim);min-height:1.4em;margin:0;min-width:0}
button,.btn{font:inherit;font-weight:500;color:var(--ink);background:var(--raise);border:1px solid var(--line);padding:9px 14px;cursor:pointer;line-height:1.3}
button:hover,.btn:hover{border-color:var(--ice)}
button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt)}
.primary{background:var(--hot);border-color:var(--hot);color:#17061f;font-weight:700}
.primary:hover{border-color:var(--ink)}
#rec.on{background:var(--hot);border-color:var(--hot);color:#17061f;font-weight:700}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.btn:focus-within{outline:2px solid var(--volt);outline-offset:2px}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.rack{display:flex;flex-direction:column;gap:18px;background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
h2{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.18em;color:var(--ice);margin:0 0 8px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.preset{padding:0;display:flex;flex-direction:column;background:var(--raise);text-align:left}
.preset i{display:block;height:22px}
.preset span{padding:5px 6px;font-size:13px;line-height:1.25}
.sliders{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:6.4em minmax(0,1fr) 2.4em;gap:10px;align-items:center}
.row label{font-size:13px}
.row output{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--hot);margin:0;height:22px}
.fields{display:flex;flex-direction:column;gap:9px}
.field{display:grid;grid-template-columns:6.4em minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--void);border:1px solid var(--line);padding:6px 8px;width:100%;min-width:0}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check input{accent-color:var(--hot);width:16px;height:16px}
.seg{display:flex}
.seg button{padding:9px 10px;font-family:var(--mono);font-size:12px}
.seg button+button{border-left:0}
#fallback{border:1px solid var(--volt);padding:12px;display:flex;flex-direction:column;gap:8px}
#fallback p{margin:0;font-size:13px}
#fallback img,#fallback video{max-width:100%;max-height:30vh;display:block;align-self:flex-start}
/* full-screen camera mode */
#camUI,#fbClose{display:none}
body.cam{overflow:hidden}
body.cam .frame{position:fixed;inset:0;z-index:50;border:0;background:#000;min-height:0}
body.cam #view{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
body.cam #camUI{display:block}
body.cam #fbClose{display:inline-block}
body.cam #fallback{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:60;background:var(--panel)}
.camTop,.camBottom{position:absolute;left:0;right:0;display:flex;align-items:center;padding-inline:16px}
.camTop{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);justify-content:space-between}
.camBottom{bottom:0;flex-direction:column;gap:14px;padding-top:28px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(transparent,#000b)}
.camChips{display:flex;gap:10px;overflow-x:auto;max-width:100%;padding:3px}
.camChips button{flex:none;width:46px;height:30px;padding:0;border:2px solid #000a}
.camChips button[aria-pressed="true"]{border-color:var(--volt)}
.camRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:420px}
#camRec{width:74px;height:74px;border-radius:50%;border:4px solid var(--ink);background:var(--hot);padding:0}
#camRec.on{border-radius:16px;width:54px;height:54px;margin:10px}
#camShot{justify-self:start;width:54px;height:54px;border-radius:50%;background:var(--ink);border:4px solid #0009;padding:0}
#camFlip,#camClose{width:48px;height:48px;border-radius:50%;padding:0;background:#000a;font-size:20px;line-height:1}
#camFlip{justify-self:end}
#camTime{font-family:var(--mono);font-size:14px;background:var(--hot);color:#17061f;padding:2px 10px;font-variant-numeric:tabular-nums}
#camTime:empty{display:none}
#camClose{visibility:hidden}
#camGear{width:40px;height:40px;border-radius:50%;padding:0;background:#000a;font-size:19px;line-height:1}
/* settings: the control rack becomes a sheet over the camera, opened by the gear */
.camOnly{display:none}
body.cam .camOnly{display:flex;justify-content:space-between}
body.cam .rack{display:none;position:fixed;left:0;right:0;bottom:0;max-height:64%;overflow-y:auto;z-index:55;background:#161136f0;border-width:1px 0 0;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);-webkit-overflow-scrolling:touch}
body.cam.set .rack{display:flex}
@media (min-width:821px){body.cam .rack{left:auto;top:0;max-height:none;width:360px;border-width:0 0 0 1px}}
#boot{position:fixed;inset:0;z-index:70;background:var(--void);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#boot p{margin:0;color:var(--dim);max-width:30em}
#boot .bar{justify-content:center}
.ghost{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .stage{top:env(safe-area-inset-top,0px);background:var(--void);padding-block:6px;z-index:2}
  #view{max-height:40vh}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>電脳写真機</h1>
    <p data-t="intro"></p>
    <button type="button" id="lang"></button>
  </header>

  <div class="grid">
    <section class="stage" id="stage">
      <div class="frame" id="frame">
        <canvas id="view" width="900" height="600" role="img"></canvas>
        <span class="tag" id="sampleTag">SAMPLE</span>
        <div id="camUI">
          <div class="camTop"><button type="button" id="camClose">✕</button><span id="camTime"></span><button type="button" id="camGear">⚙</button></div>
          <div class="camBottom">
            <div class="camChips" id="camChips"></div>
            <div class="camRow"><button type="button" id="camShot"></button><button type="button" id="camRec"></button><button type="button" id="camFlip">⟲</button></div>
          </div>
        </div>
      </div>
      <div class="bar">
        <button type="button" id="cam" hidden></button>
        <label class="btn primary"><span data-t="choose"></span><input type="file" id="file" accept="image/*,video/*"></label>
        <button type="button" id="compare" aria-pressed="false" data-t="original"></button>
        <button type="button" id="flip" hidden></button>
        <button type="button" id="play" hidden></button>
        <button type="button" id="rec" hidden></button>
      </div>
      <div class="bar">
        <span class="seg" role="group" id="fmtGroup">
          <button type="button" id="fmtJpg" aria-pressed="true">JPG</button>
          <button type="button" id="fmtPng" aria-pressed="false">PNG</button>
        </span>
        <button type="button" id="save"></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div id="fallback" hidden>
        <p id="fallbackMsg"></p>
        <img id="fallbackImg" alt="" hidden>
        <video id="fallbackVid" controls playsinline hidden></video>
        <div class="bar"><button type="button" id="share" class="primary" hidden></button><button type="button" id="fbClose"></button></div>
      </div>
    </section>

    <section class="rack" id="rack">
      <div class="bar camOnly"><h2 data-t="hSet" style="margin:0"></h2><button type="button" id="setDone" data-t="done"></button></div>
      <div>
        <h2 data-t="hColor"></h2>
        <div class="presets" id="presets"></div>
      </div>
      <div>
        <h2 data-t="hFx"></h2>
        <div class="sliders" id="sliders"></div>
      </div>
      <div class="bar">
        <button type="button" id="reroll" data-t="reroll"></button>
        <button type="button" id="lucky" data-t="lucky"></button>
        <button type="button" id="reset" data-t="reset"></button>
      </div>
      <div>
        <h2 data-t="hHud"></h2>
        <div class="fields">
          <label class="check"><input type="checkbox" id="hud" checked><span data-t="hudOn"></span></label>
          <label class="field" for="caption"><span data-t="caption"></span><input type="text" id="caption" maxlength="32" value="NEO-TOKYO // SECTOR 07"></label>
          <label class="field" for="kanji"><span data-t="kanji"></span><input type="text" id="kanji" maxlength="8" value="電脳都市"></label>
        </div>
      </div>
      <div class="bar camOnly"><button type="button" id="import" data-t="choose"></button><button type="button" id="lang2"></button></div>
    </section>
  </div>
</div>
<div id="boot" hidden>
  <h1>電脳写真機</h1>
  <p id="bootMsg"></p>
  <div class="bar"><button type="button" id="bootStart" class="primary" hidden></button><button type="button" id="bootFile" hidden></button></div>
</div>

    function(){v.muted=true;v.play().then(function(){r.start();},function(){rec=null;modeUI();setStatus("stFail");});});

    };
    document.body.appendChild(v);
  }).catch(function(){setStatus("stNoCam");bootKey="stNoCam";$("bootMsg").textContent=t(bootKey);$("bootStart").hidden=false;$("bootFile").hidden=false;});
}
var wake=null;
function exitCam(){
  if(rec)return;
  document.body.classList.remove("cam");try{if(wake){wake.release();wake=null;}}catch(e){}
  setSource(sample(),true);setStatus("stSample");
}
$("camClose").addEventListener("click",exitCam);
$("camShot").addEventListener("click",function(){$("save").click();});
$("camGear").addEventListener("click",function(){document.body.classList.toggle("set");});
$("setDone").addEventListener("click",function(){document.body.classList.remove("set");});
$("import").addEventListener("click",function(){$("file").click();});
$("lang2").addEventListener("click",function(){$("lang").click();});
$("bootStart").addEventListener("click",startCam);
$("bootFile").addEventListener("click",function(){$("file").click();});
$("camRec").addEventListener("click",function(){document.body.classList.remove("set");$("fallback").hidden=true;$("rec").click();});
$("camFlip").addEventListener("click",function(){$("flip").click();});
$("fbClose").addEventListener("click",function(){$("fallback").hidden=true;});
$("cam").addEventListener("click",startCam);
$("flip").addEventListener("click",function(){if(rec){setStatus("stRecBusy");return;}facing=facing==="environment"?"user":"environment";startCam();});
$("share").addEventListener("click",function(){
  if(!lastBlob)return;
  try{var f=new File([lastBlob],lastName,{type:lastBlob.type.split(";")[0]});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return;}}catch(e){}
  var a=document.createElement("a");a.href=URL.createObjectURL(lastBlob);a.download=lastName;document.body.appendChild(a);a.click();a.remove();
});
$("cam").hidden=!(standalone&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
if(!$("cam").hidden){$("cam").classList.add("primary");$("file").parentNode.classList.remove("primary");}

sync();applyLang();setSource(sample(),true);
if(!$("cam").hidden){$("boot").hidden=false;startCam();}   /* open straight into the camera */
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('16px "Share Tech Mono"'),document.fonts.load('16px "DotGothic16"',"電脳都市")]).then(draw,function(){});}
})();
</script>
</body>
</html>
